<!DOCTYPE html>
<!--
  📄 i.html — 모바일 청첩장 페이지
  이 파일은 수정할 필요가 없습니다.
  에디터(index.html)에서 만든 링크가 이 페이지를 열면서
  링크 속 데이터를 읽어 청첩장을 자동으로 그립니다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 페이지 전체(글자 포함)의 확대까지 막고 싶으면 위 줄을 지우고 아래 줄의 주석을 푸세요.
     다만 눈이 불편한 분이 글씨를 키울 수 없게 되니 권하지는 않아요.
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
-->
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<title>모바일 청첩장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🤍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E3A2C;        /* 딥 올리브 */
  --ink-soft:#465243;
  --cream:#F6F4EC;      /* 크림 배경 */
  --sage:#A8B096;       /* 세이지 */
  --sage-lt:#CDD3C2;
  --gold:#C0A97E;       /* 골드 포인트 */
  --line:#DDDCCF;
  --white:#FDFCF8;
  --muted:#7C8476;
  /* 글꼴 — 테마에 따라 아래에서 덮어써져요 */
  --f-ko:'Noto Serif KR',serif;      /* 한글 본문 */
  --f-en:'Cormorant Garamond',serif; /* 영문 장식 */
  --f-script:'Great Vibes',cursive;  /* 필기체 */
}
/* ── 테마: 글꼴 세트 ── */
#app.theme-classic{--f-ko:'Nanum Myeongjo',serif;--f-en:'Cormorant Garamond',serif;--f-script:'Great Vibes',cursive}
#app.theme-modern{--f-ko:'Noto Sans KR',sans-serif;--f-en:'Josefin Sans',sans-serif;--f-script:'Josefin Sans',sans-serif}
#app.theme-romantic{--f-ko:'Nanum Myeongjo',serif;--f-en:'Playfair Display',serif;--f-script:'Nanum Pen Script',cursive}
/* 로맨틱 테마의 손글씨는 획이 얇아 조금 키워요 */
#app.theme-romantic .hero .amp,#app.theme-romantic .amp2,#app.theme-romantic .amp3{font-size:1.35em;position:relative;top:.06em}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--f-ko);
  background:#E9E7DD;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
input,textarea,select{user-select:auto;-webkit-user-select:auto}
#app{font-family:var(--f-ko);max-width:430px;margin:0 auto;background:var(--cream);min-height:100dvh;overflow-x:hidden;box-shadow:0 0 40px rgba(0,0,0,.12)}
img{display:block;max-width:100%}
/* ── 사진 확대 방지 ──────────────────────────────────
   · touch-action:pan-y  → 사진 위에서 두 손가락 확대·더블탭 확대가 안 돼요
   · touch-callout:none  → 길게 눌러도 '이미지 저장' 메뉴가 안 떠요
   · user-drag:none      → PC에서 사진을 끌어다 빼낼 수 없어요
   페이지 전체 확대까지 막고 싶으면 맨 위 viewport 줄을 참고하세요.   */
img{
  touch-action:pan-y;
  -webkit-touch-callout:none;
  -webkit-user-drag:none;user-drag:none;
  pointer-events:auto;
}
.lb img{touch-action:none}
.serif-en{font-family:var(--f-en)}
.sans{font-family:'Noto Sans KR',sans-serif}
section{padding:72px 24px;word-break:keep-all;overflow-wrap:break-word}
.eyebrow{
  font-family:var(--f-en);
  letter-spacing:.35em;font-size:13px;color:var(--gold);
  text-align:center;text-transform:uppercase;margin-bottom:14px;
}
.sec-title{text-align:center;font-size:20px;font-weight:500;margin-bottom:36px;letter-spacing:.08em}
.orna{display:flex;align-items:center;gap:12px;justify-content:center;margin:0 auto 36px;max-width:220px}
.orna::before,.orna::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orna::after{background:linear-gradient(90deg,var(--gold),transparent)}
.orna span{color:var(--gold);font-size:11px}
/* fade up */
.fu{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.fu.on{opacity:1;transform:none}
/* 첫 화면(표지)만 천천히 올라오게 — 0.9초 → 1.8초 (2배)
   더 느리게/빠르게 하고 싶으면 아래 1.8s 두 곳의 숫자만 바꾸면 돼요 */
.hero .fu{transition:opacity 1.8s ease,transform 1.8s ease}

/* ── HERO ── */
.hero{position:relative;height:100dvh;min-height:560px;overflow:hidden;padding:0}
.hero img{width:100%;height:100%;object-fit:cover;will-change:transform}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,18,20,.15) 0%,rgba(24,18,20,0) 35%,rgba(24,18,20,.82) 100%)}
.hero .txt{
  position:absolute;left:0;right:0;bottom:52px;text-align:center;color:var(--white);padding:0 24px;
  text-shadow:0 1px 12px rgba(0,0,0,.5),0 0 2px rgba(0,0,0,.35);
}
.hero .lead{font-size:14px;line-height:2.1;opacity:.92;margin-bottom:18px;font-weight:300}
.hero .names{font-family:var(--f-en);font-size:44px;font-weight:400;letter-spacing:.06em;line-height:1.2}
.hero .amp{font-family:var(--f-script);font-size:30px;color:var(--gold);margin:0 10px}
.hero .date-en{font-family:var(--f-en);letter-spacing:.4em;font-size:14px;margin-top:14px;opacity:.9}
.hero .venue-box{
  display:inline-block;margin-top:22px;padding:14px 26px;position:relative;font-size:13px;line-height:1.9;font-weight:300;
}
.hero .venue-box::before,.hero .venue-box::after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--gold)}
.hero .venue-box::before{left:0;top:0;border-right:none;border-bottom:none}
.hero .venue-box::after{right:0;bottom:0;border-left:none;border-top:none}
/* ── HERO 변형: 아치형 ── */
.hero.style-arch{height:auto;min-height:0;background:var(--cream);padding:64px 28px 56px;text-align:center}
.hero.style-arch .archwrap{max-width:300px;margin:0 auto}
.hero.style-arch .eyebrow2{font-family:var(--f-en);letter-spacing:.32em;font-size:11px;color:var(--gold);text-transform:uppercase;margin-bottom:22px}
.hero.style-arch .archimg{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:160px 160px 12px 12px;display:block}
.hero.style-arch .names2{font-family:var(--f-ko);font-size:23px;font-weight:500;margin-top:28px;letter-spacing:.1em;color:var(--ink)}
.hero.style-arch .names2 .amp2{color:var(--gold);font-family:var(--f-script);font-size:22px;margin:0 8px}
.hero.style-arch .info2{margin-top:14px;font-size:13px;line-height:2;color:var(--muted);font-weight:300}
/* ── HERO 변형: 액자형 ── */
.hero.style-frame{height:auto;min-height:0;background:var(--ink);padding:56px 28px;text-align:center}
.hero.style-frame .framecard{background:var(--white);max-width:310px;margin:0 auto;padding:22px 22px 30px;border-radius:6px;box-shadow:0 16px 44px rgba(0,0,0,.28)}
.hero.style-frame .names3{font-family:var(--f-ko);font-size:17px;font-weight:500;letter-spacing:.14em;color:var(--ink);padding:10px 0 18px}
.hero.style-frame .names3 .amp3{color:var(--gold);font-family:var(--f-script);font-size:20px;margin:0 7px}
.hero.style-frame .frameimg{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.hero.style-frame .info3{margin-top:20px;font-size:12.5px;line-height:2;color:var(--muted);font-weight:300}
.hero.style-frame .datebig{font-family:var(--f-en);font-size:26px;letter-spacing:.28em;color:var(--ink);margin-top:16px}
/* ══════════ 표지 변형: 클래식 계열 ══════════ */
/* 띠형 — 사진 아래 크림 띠에 이름·날짜 */
.hero.style-band{height:auto;min-height:0;background:var(--cream);padding:0;text-align:center}
.hero.style-band .bandimg{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--sage-lt)}
.hero.style-band .bandbox{padding:34px 26px 46px}
.hero.style-band .eyebrowB{font-family:var(--f-en);letter-spacing:.34em;font-size:10.5px;color:var(--gold);text-transform:uppercase}
.hero.style-band .namesB{font-family:var(--f-ko);font-size:24px;font-weight:500;letter-spacing:.1em;margin-top:16px;color:var(--ink)}
.hero.style-band .namesB .ampB{font-family:var(--f-script);color:var(--gold);font-size:21px;margin:0 9px}
.hero.style-band .ruleB{width:34px;height:1px;background:var(--gold);margin:20px auto}
.hero.style-band .infoB{font-size:13px;line-height:2;color:var(--muted);font-weight:300}

/* 라인형 — 사진 위 얇은 사각 라인 프레임 */
.hero.style-line{position:relative;height:100dvh;min-height:560px;overflow:hidden;padding:0}
.hero.style-line .lineimg{width:100%;height:100%;object-fit:cover}
.hero.style-line .lineveil{position:absolute;inset:0;background:rgba(26,20,22,.34)}
.hero.style-line .linebox{
  position:absolute;inset:26px;border:1px solid rgba(253,252,248,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:var(--white);padding:24px;
  text-shadow:0 1px 10px rgba(0,0,0,.4);
}
.hero.style-line .eyebrowL{font-family:var(--f-en);letter-spacing:.36em;font-size:10.5px;text-transform:uppercase;opacity:.9}
.hero.style-line .namesL{font-family:var(--f-en);font-size:38px;letter-spacing:.14em;margin:22px 0;line-height:1.3;text-transform:uppercase}
.hero.style-line .dateL{font-family:var(--f-en);letter-spacing:.3em;font-size:13px;margin-bottom:10px}
.hero.style-line .infoL{font-size:12.5px;line-height:1.95;font-weight:300;opacity:.92}

/* ══════════ 표지 변형: 모던 계열 ══════════ */
/* 분할형 — 위 사진 / 아래 큰 날짜 */
.hero.style-split{height:auto;min-height:0;background:var(--cream);padding:0;text-align:left}
.hero.style-split .splitimg{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--sage-lt)}
.hero.style-split .splitbox{padding:32px 28px 46px}
.hero.style-split .bigdate{font-family:var(--f-en);font-size:52px;line-height:1;letter-spacing:.02em;color:var(--ink);font-weight:400}
.hero.style-split .bigdate small{display:block;font-size:12px;letter-spacing:.3em;color:var(--gold);margin-top:12px;text-transform:uppercase}
.hero.style-split .namesS{font-family:var(--f-ko);font-size:19px;font-weight:500;letter-spacing:.08em;margin-top:26px;color:var(--ink)}
.hero.style-split .namesS .ampS{color:var(--gold);margin:0 8px}
.hero.style-split .infoS{font-size:12.5px;line-height:2;color:var(--muted);margin-top:12px;font-weight:300}

/* 미니멀형 — 여백 많은 타이포 중심 */
.hero.style-minimal{height:auto;min-height:0;background:var(--white);padding:74px 30px 62px;text-align:center}
.hero.style-minimal .miniwrap{max-width:290px;margin:0 auto}
.hero.style-minimal .namesM{font-family:var(--f-en);font-size:30px;letter-spacing:.2em;text-transform:uppercase;line-height:1.5;color:var(--ink)}
.hero.style-minimal .ruleM{width:1px;height:40px;background:var(--line);margin:26px auto}
.hero.style-minimal .miniimg{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--sage-lt)}
.hero.style-minimal .dateM{font-family:var(--f-en);letter-spacing:.34em;font-size:12.5px;color:var(--gold);margin-top:28px}
.hero.style-minimal .infoM{font-size:12.5px;line-height:2;color:var(--muted);margin-top:12px;font-weight:300}

/* ══════════ 표지 변형: 로맨틱 계열 ══════════ */
/* 필기체형 — 사진 위 큰 손글씨 이름 */
.hero.style-script{position:relative;height:100dvh;min-height:560px;overflow:hidden;padding:0}
.hero.style-script .scrimg{width:100%;height:100%;object-fit:cover}
.hero.style-script .scrveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,20,24,.30) 0%,rgba(30,20,24,.05) 45%,rgba(30,20,24,.62) 100%)}
.hero.style-script .scrbox{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:var(--white);padding:0 28px;
  text-shadow:0 2px 16px rgba(0,0,0,.45);
}
.hero.style-script .namesC{font-family:var(--f-script);font-size:56px;line-height:1.25;font-weight:400}
.hero.style-script .namesC .ampC{display:block;font-size:.5em;opacity:.85;margin:2px 0}
.hero.style-script .dateC{font-family:var(--f-en);letter-spacing:.3em;font-size:13px;margin-top:26px}
.hero.style-script .infoC{font-size:12.5px;line-height:2;font-weight:300;margin-top:10px;opacity:.94}

/* 부드러운형 — 크림 배경 + 타원 사진 */
.hero.style-soft{height:auto;min-height:0;background:var(--cream);padding:60px 28px 54px;text-align:center}
.hero.style-soft .softwrap{max-width:300px;margin:0 auto}
.hero.style-soft .greet{font-family:var(--f-script);font-size:34px;color:var(--gold);line-height:1.3;margin-bottom:22px}
.hero.style-soft .softimg{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:50%/44%;display:block;background:var(--sage-lt)}
.hero.style-soft .namesF{font-family:var(--f-ko);font-size:22px;font-weight:500;letter-spacing:.1em;margin-top:28px;color:var(--ink)}
.hero.style-soft .namesF .ampF{font-family:var(--f-script);color:var(--gold);font-size:1.1em;margin:0 9px}
.hero.style-soft .infoF{font-size:13px;line-height:2;color:var(--muted);margin-top:14px;font-weight:300}

/* 카드형 — 흰 카드 + 손글씨 */
.hero.style-petalcard{height:auto;min-height:0;background:linear-gradient(170deg,var(--sage-lt),var(--cream));padding:54px 26px;text-align:center;position:relative}
.hero.style-petalcard .pcard{background:var(--white);max-width:308px;margin:0 auto;padding:26px 24px 32px;border-radius:4px;box-shadow:0 18px 46px rgba(0,0,0,.16);position:relative;z-index:2}
.hero.style-petalcard .greetP{font-family:var(--f-script);font-size:30px;color:var(--gold);margin-bottom:18px;line-height:1.25}
.hero.style-petalcard .pimg{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--sage-lt)}
.hero.style-petalcard .namesP{font-family:var(--f-ko);font-size:19px;font-weight:500;letter-spacing:.12em;margin-top:22px;color:var(--ink)}
.hero.style-petalcard .namesP .ampP{font-family:var(--f-script);color:var(--gold);font-size:1.15em;margin:0 8px}
.hero.style-petalcard .infoP{font-size:12.5px;line-height:2;color:var(--muted);margin-top:12px;font-weight:300}
/* 꽃잎 */
.petal{position:absolute;top:-4vh;border-radius:60% 40% 55% 45%/55% 60% 40% 45%;background:var(--sage-lt);opacity:.7;animation:fall linear infinite;pointer-events:none}
@keyframes fall{
  0%{transform:translateY(-6vh) translateX(0) rotate(0)}
  100%{transform:translateY(110vh) translateX(var(--dx)) rotate(340deg)}
}

/* ── 초대 (올리브 블록) ── */
.invite{background:var(--ink);color:var(--cream);text-align:center}
.invite .eyebrow{color:var(--sage-lt)}
.invite .msg{font-size:15.5px;line-height:2.5;font-weight:300;white-space:pre-line}
.invite .fam{margin-top:44px;font-size:14.5px;line-height:2.3;font-weight:300}
.invite .fam b{font-weight:500;color:var(--white)}
.invite .fam .rel{color:var(--sage-lt);font-size:13px;margin:0 8px}

/* ── 캘린더 ── */
.cal-wrap{max-width:320px;margin:0 auto;text-align:center}
.cal-month{font-family:var(--f-ko);font-size:27px;font-weight:500;letter-spacing:.12em;margin-bottom:6px}
.cal-sub{font-size:13px;color:var(--muted);margin-bottom:26px;font-family:'Noto Sans KR',sans-serif}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;font-family:'Noto Sans KR',sans-serif;font-size:13.5px}
.cal .h{color:var(--muted);font-size:11px;padding-bottom:8px;letter-spacing:.1em}
.cal .d{padding:9px 0;position:relative}
.cal .sun{color:#B0765E}
.cal .sat{color:var(--muted)}
.cal .w{color:var(--white);z-index:0}
.cal .w::before{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);background:var(--ink);border-radius:50%;z-index:-1}
.cal .w::after{content:"";position:absolute;left:50%;bottom:-4px;width:4px;height:4px;border-radius:50%;background:var(--gold);transform:translateX(-50%)}
.dday{margin-top:34px;font-size:15px;letter-spacing:.03em}
.dday b{color:var(--gold);font-weight:500}

/* ── 오시는 길 ── */
.loc{background:var(--white)}
.loc .addr{text-align:center;font-size:14px;color:var(--muted);line-height:1.9;font-family:'Noto Sans KR',sans-serif;margin-bottom:26px}
.loc .vname{text-align:center;font-size:17px;font-weight:500;margin-bottom:6px}
.mapbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:34px}
.mapbtns a{
  display:block;text-align:center;padding:13px 0;border-radius:8px;text-decoration:none;
  font-family:'Noto Sans KR',sans-serif;font-size:13.5px;font-weight:500;white-space:nowrap;
}
.mb-kakao{background:#FEE500;color:#191600}
.mb-naver{background:#03C75A;color:#fff}
.mb-tmap{background:var(--ink);color:var(--white)}
.tbox{border:1px solid var(--line);border-radius:12px;padding:22px 20px;margin-bottom:14px;background:var(--cream)}
.tbox h4{font-size:14px;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.tbox h4 span{color:var(--gold)}
.tbox p{font-size:13.5px;line-height:2;color:var(--ink-soft);font-family:'Noto Sans KR',sans-serif;font-weight:300;white-space:pre-line}

/* ── 갤러리 ── */
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.gal-grid button{border:0;padding:0;background:var(--sage-lt);aspect-ratio:1;overflow:hidden;cursor:pointer}
.gal-grid img{width:100%;height:100%;object-fit:cover}
/* 라이트박스 */
.lb{position:fixed;inset:0;background:rgba(20,24,18,.95);display:none;z-index:60;align-items:center;justify-content:center;flex-direction:column}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:78dvh;object-fit:contain}
.lb .cnt{color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:13px;position:absolute;top:calc(20px + env(safe-area-inset-top));left:0;right:0;text-align:center;opacity:.8}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:18px;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}

/* ── 계좌 ── */
.acc{background:var(--ink);color:var(--cream)}
.acc .eyebrow{color:var(--sage-lt)}
.acc .desc{text-align:center;font-size:14px;line-height:2.2;font-weight:300;margin-bottom:34px}
.acc-g{max-width:340px;margin:0 auto 12px}
.acc-g summary{
  list-style:none;cursor:pointer;text-align:center;padding:15px;border:1px solid rgba(253,252,248,.35);
  border-radius:10px;font-size:14.5px;letter-spacing:.05em;
}
.acc-g summary::-webkit-details-marker{display:none}
.acc-row{
  background:rgba(253,252,248,.07);border-radius:10px;padding:16px 18px;margin-top:10px;
  font-family:'Noto Sans KR',sans-serif;
}
.acc-row .who{font-size:12.5px;color:var(--sage-lt);margin-bottom:4px}
.acc-row .num{font-size:14.5px;letter-spacing:.02em;margin-bottom:12px;font-weight:300}
.acc-row .btns{display:flex;gap:8px;flex-wrap:wrap}
.acc-row button,.acc-row .kakao{
  border:1px solid rgba(253,252,248,.4);background:none;color:var(--cream);
  padding:8px 16px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:inherit;
}
.acc-row .kakao{
  background:#FEE500;border-color:#FEE500;color:#191600;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;font-weight:500;
}

/* ── 푸터 ── */
footer{background:var(--ink);color:var(--sage-lt);text-align:center;padding:60px 24px calc(56px + env(safe-area-inset-bottom));border-top:1px solid rgba(253,252,248,.12)}
footer .end{font-family:var(--f-en);letter-spacing:.3em;font-size:13px;margin-bottom:22px}
footer .share{
  border:1px solid rgba(253,252,248,.35);background:none;color:var(--cream);
  padding:12px 28px;border-radius:999px;font-size:13.5px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;
}
footer .yr{margin-top:34px;font-size:11px;opacity:.55;font-family:'Noto Sans KR',sans-serif;letter-spacing:.15em}
footer .credit{margin-top:10px;font-size:10.5px;opacity:.4;font-family:'Noto Sans KR',sans-serif;letter-spacing:.08em;font-weight:300}

/* 토스트 */
#toast{
  position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:rgba(30,36,28,.92);color:#fff;padding:12px 22px;border-radius:999px;
  font-family:'Noto Sans KR',sans-serif;font-size:13.5px;opacity:0;pointer-events:none;transition:.35s;z-index:99;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── RSVP ── */
.rsvp-open-btn{display:inline-block;border:1px solid var(--line);background:var(--white);color:var(--ink);padding:14px 30px;border-radius:999px;font-size:13.5px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap}
.rsvp-open-btn:disabled{opacity:.5;cursor:default}
#rsvpInlineHost{background:var(--white);border:1px solid var(--line);border-radius:16px;max-width:340px;margin:0 auto;padding:32px 26px 28px;text-align:center}
#rsvpInlineHost #rsvpBlock .eyebrow{margin-top:0}
.rsvp-modal{position:fixed;inset:0;background:rgba(20,24,18,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:24px}
.rsvp-modal.open{display:flex}
.rsvp-card{background:var(--cream);border-radius:18px;max-width:360px;width:100%;padding:34px 26px 26px;position:relative;max-height:88dvh;overflow-y:auto;text-align:center}
.rsvp-x{position:absolute;top:14px;right:16px;background:none;border:0;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
#rsvpBlock h3{font-size:18px;font-weight:500;margin:4px 0 12px;color:var(--ink);font-family:var(--f-ko)}
#rsvpBlock .rsvp-desc{font-size:12px;line-height:1.8;color:var(--ink-soft);font-family:'Noto Sans KR',sans-serif;font-weight:300;margin-bottom:22px;white-space:pre-line}
.rsvp-seg{display:flex;gap:8px;margin-bottom:10px}
.rsvp-seg button{flex:1;padding:12px 0;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px;cursor:pointer}
.rsvp-seg button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
#rsvpForm select,#rsvpForm input,#rsvpForm textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-size:13.5px;font-family:'Noto Sans KR',sans-serif;background:var(--white);color:var(--ink);margin-bottom:10px;-webkit-appearance:none}
#rsvpForm textarea{resize:none;min-height:60px}
/* 연락처 3칸 입력 */
.rsvp-fl{font-family:'Noto Sans KR',sans-serif;font-size:11.5px;font-weight:300;color:var(--muted);text-align:left;margin:2px 0 6px}
.rsvp-fl b{color:var(--gold);font-weight:400}
.rsvp-tel{display:flex;align-items:center;gap:6px;margin-bottom:10px}
#rsvpForm .rsvp-tel input{flex:1;min-width:0;text-align:center;margin-bottom:0;letter-spacing:.02em}
.rsvp-tel span{flex:0 0 auto;color:var(--muted);font-family:'Noto Sans KR',sans-serif;font-size:14px}
.rsvp-tel .fixed{flex:0 0 62px;border:1px solid var(--line);border-radius:9px;padding:12px 0;text-align:center;background:var(--cream);color:var(--muted);font-family:'Noto Sans KR',sans-serif;font-size:13.5px}
.rsvp-submit{width:100%;border:0;background:var(--ink);color:var(--cream);padding:14px 0;border-radius:9px;font-size:14.5px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:4px}
.rsvp-submit:disabled{opacity:.6}
.rsvp-privacy{font-family:'Noto Sans KR',sans-serif;font-size:10.5px;font-weight:300;line-height:1.7;color:var(--muted);opacity:.8;text-align:center;margin:2px 0 6px}
.rsvp-privacy a{color:inherit;text-decoration:underline;text-underline-offset:2px}

/* ── 게스트 스냅 ── */
#snapSec{text-align:center}
#snapSec .snap-desc{font-size:13.5px;line-height:2;color:var(--muted);font-family:'Noto Sans KR',sans-serif;font-weight:300;white-space:pre-line;margin-bottom:30px}
#snapProgress{margin-top:14px;font-size:12.5px;color:var(--muted);font-family:'Noto Sans KR',sans-serif}

/* 오류 화면 */
#err{display:none;min-height:100dvh;align-items:center;justify-content:center;text-align:center;padding:40px;font-family:'Noto Sans KR',sans-serif;color:var(--muted);line-height:2}

@media print{.lb,#toast,footer .share{display:none!important}}
@media (prefers-reduced-motion:reduce){.fu{transition:none;opacity:1;transform:none}.petal{display:none}}
</style>
</head>
<body>
<div id="err"><p>청첩장 정보를 찾을 수 없습니다.<br>링크가 잘려서 전달되었을 수 있어요.<br>받으신 링크 전체를 다시 복사해 열어주세요.</p></div>
<div id="app" style="display:none">

  <!-- HERO -->
  <section class="hero">
    <img id="heroImg" alt="">
    <div class="veil"></div>
    <div id="petals"></div>
    <div class="txt">
      <p class="lead fu" id="lead"></p>
      <div class="names fu" id="names"></div>
      <div class="date-en fu" id="dateEn"></div>
      <div class="venue-box fu" id="venueBox"></div>
    </div>
  </section>

  <!-- 초대 -->
  <section class="invite" id="inviteSec">
    <div class="eyebrow fu">Invitation</div>
    <h2 class="sec-title fu" style="color:var(--white)" id="inviteTitle">소중한 분들을 초대합니다</h2>
    <div class="orna fu"><span>❦</span></div>
    <p class="msg fu" id="inviteMsg"></p>
    <div class="fam fu" id="fam"></div>
  </section>

  <!-- 캘린더 -->
  <section id="calSec">
    <div class="eyebrow fu">Save the date</div>
    <div class="cal-wrap fu">
      <div class="cal-month" id="calMonth"></div>
      <div class="cal-sub" id="calSub"></div>
      <div class="cal" id="cal"></div>
      <p class="dday" id="dday"></p>
    </div>
  </section>

  <!-- 오시는 길 -->
  <section class="loc" id="locSec">
    <div class="eyebrow fu">Location</div>
    <h2 class="sec-title fu">오시는 길</h2>
    <p class="vname fu" id="locName"></p>
    <p class="addr fu" id="locAddr"></p>
    <div class="mapbtns fu">
      <a id="mKakao" class="mb-kakao" target="_blank" rel="noopener">카카오맵</a>
      <a id="mNaver" class="mb-naver" target="_blank" rel="noopener">네이버지도</a>
      <a id="mTmap" class="mb-tmap" href="#">티맵</a>
    </div>
    <div id="transWrap"></div>
  </section>

  <!-- RSVP: 바로 표시 모드일 때 여기에 폼이 옮겨져요 -->
  <section id="rsvpInlineSec" style="display:none">
    <div class="fu" id="rsvpInlineHost"></div>
  </section>

  <!-- 갤러리 -->
  <section id="galSec">
    <div class="eyebrow fu">Gallery</div>
    <h2 class="sec-title fu" id="galTitle">우리의 순간들</h2>
    <div class="gal-grid fu" id="gal"></div>
  </section>

  <!-- 계좌 -->
  <section class="acc" id="accSec">
    <div class="eyebrow fu">With gratitude</div>
    <h2 class="sec-title fu" style="color:var(--white)">마음 전하실 곳</h2>
    <div id="accWrap"></div>
  </section>

  <!-- 게스트 스냅 -->
  <section id="snapSec" style="display:none">
    <div class="eyebrow fu">Guest Snap</div>
    <h2 class="sec-title fu" id="snapTitleEl">게스트 스냅</h2>
    <p class="snap-desc fu" id="snapDescEl"></p>
    <div class="fu">
      <input type="file" id="snapFile" accept="image/*" multiple style="display:none">
      <button class="rsvp-open-btn" id="snapBtn">사진 업로드</button>
      <div id="snapProgress"></div>
    </div>
  </section>

  <footer>
    <div class="end fu">Thank you</div>
    <p class="fu" id="footMsg" style="font-size:14px;line-height:2.3;font-weight:300;margin-bottom:30px;white-space:pre-line"></p>
    <button class="share fu" id="copyLink">청첩장 링크 복사하기</button>
    <div class="yr" id="yr"></div>
    <div class="credit" id="credit"></div>
  </footer>
</div>

<div class="lb" id="lb">
  <div class="cnt" id="lbCnt"></div>
  <button class="x" id="lbX" aria-label="닫기">✕</button>
  <img id="lbImg" alt="">
</div>
<div id="toast"></div>

<div class="rsvp-modal" id="rsvpModal">
  <div class="rsvp-card">
    <button class="rsvp-x" id="rsvpX" aria-label="닫기">✕</button>
    <div id="rsvpBlock">
    <div class="eyebrow" style="margin-top:2px">RSVP</div>
    <h3 id="rsvpTitleEl">참석 여부 안내</h3>
    <p class="rsvp-desc" id="rsvpDescEl"></p>
    <form id="rsvpForm">
      <div class="rsvp-seg" id="rsvpAttendSeg">
        <button type="button" data-v="yes" class="on">참석</button>
        <button type="button" data-v="no">불참</button>
      </div>
      <input type="hidden" id="rsvpAttend" value="yes">
      <select id="rsvpSide">
        <option value="">신랑측 · 신부측 (선택)</option>
        <option value="신랑측">신랑측 하객</option>
        <option value="신부측">신부측 하객</option>
      </select>
      <input id="rsvpName" placeholder="성함" required>
      <input id="rsvpGuests" type="number" min="1" max="20" value="1" placeholder="참석 인원 (본인 포함)">
      <div class="rsvp-fl">연락처 <b>*</b></div>
      <div class="rsvp-tel">
        <div class="fixed" aria-hidden="true">010</div>
        <span>-</span>
        <input id="rsvpPhone2" type="tel" inputmode="numeric" maxlength="4" placeholder="1234" aria-label="연락처 가운데 네 자리">
        <span>-</span>
        <input id="rsvpPhone3" type="tel" inputmode="numeric" maxlength="4" placeholder="5678" aria-label="연락처 뒤 네 자리">
      </div>
      <textarea id="rsvpMsg" placeholder="전하실 말씀 (선택)"></textarea>
      <p class="rsvp-privacy" id="rsvpPrivacy"></p>
      <button type="submit" class="rsvp-submit">전달하기</button>
    </form>
    </div>
  </div>
</div>

<script>
/* ── RSVP 개인정보 안내문 (참석 여부 폼 아래에 작고 연하게 표시돼요) ──
   PRIVACY_URL 을 비우면 링크 없이 글씨만 표시됩니다.                     */
const PRIVACY_TEXT      = '연락처 정보 제출 시 {개인정보처리방침}에 동의하는 것으로 간주됩니다';
const PRIVACY_URL       = '/privacy.html';

const CREDIT_TEXT = 'made by 밍지로움';  /* ← 크레딧 문구는 여기서만 바꾸면 돼요 */
const CREDIT_URL  = 'https://blog.naver.com/record_minji';  /* ← 출처 링크 (선택) 예: 'https://instagram.com/아이디' — 비우면 글씨만 표시돼요 */
{
  const c=document.getElementById('credit');
  if(CREDIT_URL){
    const a=document.createElement('a');
    a.href=CREDIT_URL;a.target='_blank';a.rel='noopener';
    a.textContent=CREDIT_TEXT;
    a.style.color='inherit';a.style.textDecoration='none';
    c.appendChild(a);
  }else{c.textContent=CREDIT_TEXT;}
}

/* ── 데이터 불러오기 ──
   1) /i.html?id=주소  → 저장소(API)에서 불러오기 (기본)
   2) /i.html?preview=1 → 에디터 미리보기
   3) /i.html#암호문   → 예전 방식 링크도 계속 동작           */
let SLUG=null; /* RSVP·게스트 스냅 전송 시 이 청첩장의 주소로 사용 */
function decode(hash){
  const b64 = hash.replace(/-/g,'+').replace(/_/g,'/');
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}
async function loadData(){
  const qs=new URLSearchParams(location.search);
  if(qs.get('preview')){
    try{return JSON.parse(sessionStorage.getItem('wpreview'));}catch(e){return null;}
  }
  let id=qs.get('id');
  if(!id){
    // vercel.json의 rewrite는 브라우저 주소창을 바꾸지 않으므로
    // /슬러그 형태의 예쁜 링크는 경로(pathname)에서 직접 슬러그를 읽어온다.
    const seg=location.pathname.replace(/^\/+|\/+$/g,'');
    if(seg && !/\.(html?|json|js|css|png|jpg|jpeg|svg|ico)$/i.test(seg)) id=seg;
  }
  if(id){
    SLUG=id;
    try{
      const r=await fetch('/api/get?id='+encodeURIComponent(id));
      if(!r.ok)return null;
      return await r.json();
    }catch(e){return null;}
  }
  try{
    const h=location.hash.slice(1);
    if(h)return decode(h);
  }catch(e){}
  return null;
}
loadData().then(D=>{
if(!D){document.getElementById('err').style.display='flex';return;}
document.getElementById('app').style.display='block';

/* 커스텀 컬러 적용 */
if(D.colors){
  const mix=(hex,ratio,to)=>{ /* to: 255=밝게, 0=어둡게 */
    const n=parseInt(hex.slice(1),16);
    const f=c=>Math.round(c+(to-c)*ratio);
    return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(f).map(c=>c.toString(16).padStart(2,'0')).join('');
  };
  const r=document.documentElement.style;
  if(D.colors.ink){r.setProperty('--ink',D.colors.ink);r.setProperty('--ink-soft',mix(D.colors.ink,0.25,255));}
  if(D.colors.cream){r.setProperty('--cream',D.colors.cream);r.setProperty('--white',mix(D.colors.cream,0.55,255));r.setProperty('--line',mix(D.colors.cream,0.12,0));}
  if(D.colors.gold)r.setProperty('--gold',D.colors.gold);
  if(D.colors.sage){r.setProperty('--sage',D.colors.sage);r.setProperty('--sage-lt',mix(D.colors.sage,0.45,255));r.setProperty('--muted',mix(D.colors.sage,0.3,0));}
}

/* 유틸 */
const $=id=>document.getElementById(id);
const toastEl=$('toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2500);}
const DAYS=['일','월','화','수','목','금','토'];
const wd=new Date(D.date+'T'+(D.time||'12:00')+':00+09:00');
const y=wd.getFullYear(), mo=wd.getMonth()+1, dt=+D.date.slice(8,10);
const dayName=DAYS[new Date(D.date+'T12:00:00+09:00').getDay()];
const [hh,mm]=(D.time||'12:00').split(':').map(Number);
const ampm=hh<12?'오전':(hh<17?'낮':'저녁');
const h12=hh%12===0?12:hh%12;

/* ── 표기 순서: nameOrder가 'bride'면 신부를 먼저 ── */
const BR = D.nameOrder==='bride';
const N1  = BR ? D.bride : D.groom;              /* 먼저 나오는 사람 */
const N2  = BR ? D.groom : D.bride;              /* 나중에 나오는 사람 */
const N1En= BR ? (D.brideEn||D.bride) : (D.groomEn||D.groom);
const N2En= BR ? (D.groomEn||D.groom) : (D.brideEn||D.bride);

/* ── 섹션 사용/미사용 (에디터에서 끈 항목은 아예 안 그려요) ── */
const SEC = D.secOn || {};
const secOff = k => SEC[k]===false;

/* 문서 제목/설명 */
document.title=`${N1} ♥ ${N2}`;

/* HERO */
const heroSec=document.querySelector('.hero');
const heroStyle=D.heroStyle||'classic';
const dateLine=`${y}년 ${mo}월 ${dt}일 ${dayName}요일 ${ampm} ${h12}시${mm?` ${mm}분`:''}`;
const dateEnLine=`${y} · ${String(mo).padStart(2,'0')} · ${String(dt).padStart(2,'0')}`;
const IMGERR="this.onerror=null;this.style.background='var(--sage-lt)';this.removeAttribute('src')";
const venueLine=`${D.venue||''}${D.hall?' · '+D.hall:''}`;
const dNum=`${y} . ${String(mo).padStart(2,'0')} . ${String(dt).padStart(2,'0')}`;

/* 테마 글꼴 적용 (classic / modern / romantic) */
document.getElementById('app').classList.add('theme-'+(D.theme||'classic'));

const HERO_HTML={
  band:`<div class="fu">
    <img class="bandimg" src="${D.hero||''}" alt="" onerror="${IMGERR}">
    <div class="bandbox">
      <div class="eyebrowB">We are getting married</div>
      <div class="namesB">${N1}<span class="ampB">&amp;</span>${N2}</div>
      <div class="ruleB"></div>
      <div class="infoB">${dateLine}<br>${venueLine}</div>
    </div></div>`,
  line:`<img class="lineimg" src="${D.hero||''}" alt="" onerror="${IMGERR}">
    <div class="lineveil"></div>
    <div class="linebox fu">
      <div class="eyebrowL">Save the date</div>
      <div class="namesL">${N1En}<br>&amp;<br>${N2En}</div>
      <div class="dateL">${dNum}</div>
      <div class="infoL">${dateLine}<br>${venueLine}</div>
    </div>`,
  split:`<div class="fu">
    <img class="splitimg" src="${D.hero||''}" alt="" onerror="${IMGERR}">
    <div class="splitbox">
      <div class="bigdate">${String(mo).padStart(2,'0')}.${String(dt).padStart(2,'0')}<small>${y} · ${dayName}요일</small></div>
      <div class="namesS">${N1}<span class="ampS">&amp;</span>${N2}</div>
      <div class="infoS">${dateLine}<br>${venueLine}</div>
    </div></div>`,
  minimal:`<div class="miniwrap fu">
    <div class="namesM">${N1En}<br>&amp;<br>${N2En}</div>
    <div class="ruleM"></div>
    <img class="miniimg" src="${D.hero||''}" alt="" onerror="${IMGERR}">
    <div class="dateM">${dNum}</div>
    <div class="infoM">${dateLine}<br>${venueLine}</div>
  </div>`,
  script:`<img class="scrimg" src="${D.hero||''}" alt="" onerror="${IMGERR}">
    <div class="scrveil"></div>
    <div class="scrbox fu">
      <div class="namesC">${N1En}<span class="ampC">&amp;</span>${N2En}</div>
      <div class="dateC">${dNum}</div>
      <div class="infoC">${dateLine}<br>${venueLine}</div>
    </div>`,
  soft:`<div class="softwrap fu">
    <div class="greet">Our Wedding Day</div>
    <img class="softimg" src="${D.hero||''}" alt="" onerror="${IMGERR}">
    <div class="namesF">${N1}<span class="ampF">&amp;</span>${N2}</div>
    <div class="infoF">${dateLine}<br>${venueLine}</div>
  </div>`,
  petalcard:`<div class="pcard fu">
    <div class="greetP">Just Married</div>
    <img class="pimg" src="${D.hero||''}" alt="" onerror="${IMGERR}">
    <div class="namesP">${N1}<span class="ampP">&amp;</span>${N2}</div>
    <div class="infoP">${dateLine}<br>${venueLine}</div>
  </div>`
};

   예전 방식(groomP에 한 줄로 적어둔 경우)도 그대로 지원해요 */
function parentsText(fa,faLate,mo,moLate,legacy){
  const parts=[];
  if(fa)parts.push((faLate?'故 ':'')+fa);
  if(mo)parts.push((moLate?'故 ':'')+mo);
  if(parts.length)return parts.join(' · ');
  return legacy||'';
}

  return `<b>${p}</b><span class="rel">의${rel?' '+rel:''}</span><b>${name}</b>`;
}

/* RSVP */
(function(){
  /* 스위치를 끈 경우 · 예전 값(button/off) 호환 */
  const mode=secOff('rsvp')?'off':(D.rsvpMode==='button'?'inline':(D.rsvpMode||'off'));
  if(mode==='off')return;
  $('rsvpTitleEl').textContent=D.rsvpTitle||'참석 여부 안내';
  $('rsvpDescEl').textContent=D.rsvpDesc||'귀한 걸음 해주시는 모든 분을 정성껏 모시고자 참석 여부를 여쭙습니다.';
  /* 개인정보 안내문: {중괄호} 안의 글자만 링크가 돼요 */
  (function(){
    const el=$('rsvpPrivacy');
    const m=PRIVACY_TEXT.match(/^(.*?)\{(.+?)\}(.*)$/);
    if(!m||!PRIVACY_URL){el.textContent=PRIVACY_TEXT.replace(/[{}]/g,'');return;}
    el.appendChild(document.createTextNode(m[1]));
    const a=document.createElement('a');
    a.href=PRIVACY_URL;a.target='_blank';a.rel='noopener';a.textContent=m[2];
    el.appendChild(a);
    el.appendChild(document.createTextNode(m[3]));
  })();
  const modal=$('rsvpModal');
  function openModal(){modal.classList.add('open');}
  function closeModal(){modal.classList.remove('open');}
  $('rsvpX').addEventListener('click',closeModal);
  modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
  /* 연락처 3칸: 숫자만 입력 · 다 채우면 다음 칸으로 · 지우면 앞 칸으로 */
  /* 연락처: 앞자리 010 고정, 뒤 4-4 두 칸만 입력 */
  const telParts=[$('rsvpPhone2'),$('rsvpPhone3')];
  telParts.forEach((el,i)=>{
    el.addEventListener('input',()=>{
      el.value=el.value.replace(/[^0-9]/g,'');
      if(el.value.length>=4&&i===0)telParts[1].focus();
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!el.value&&i>0)telParts[i-1].focus();
    });
  });
  /* 01012345678 처럼 통째로 붙여넣어도 뒤 8자리만 알아서 나눠 담아요 */
  telParts[0].addEventListener('paste',e=>{
    const raw=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');
    if(raw.length<8)return;
    e.preventDefault();
    telParts[0].value=raw.slice(-8,-4);telParts[1].value=raw.slice(-4);
    telParts[1].focus();
  });
  $('rsvpAttendSeg').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      $('rsvpAttendSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');$('rsvpAttend').value=b.dataset.v;
    });
  });
  $('rsvpForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const name=$('rsvpName').value.trim();
    if(!name){toast('성함을 입력해 주세요');return;}
    const [t1,t2]=telParts.map(el=>el.value.trim());
    if(!t1||!t2){toast('연락처를 입력해 주세요');(!t1?telParts[0]:telParts[1]).focus();return;}
    if(!/^\d{4}$/.test(t1)||!/^\d{4}$/.test(t2)){
      toast('연락처를 네 자리씩 입력해 주세요 (예: 010-1234-5678)');(!/^\d{4}$/.test(t1)?telParts[0]:telParts[1]).focus();return;
    }
    const phone=`010-${t1}-${t2}`;
    if(!SLUG){toast('미리보기에서는 전달되지 않아요');return;}
    const btn=e.target.querySelector('.rsvp-submit');btn.disabled=true;btn.textContent='전달 중...';
    try{
      const r=await fetch('/api/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        slug:SLUG,name,side:$('rsvpSide').value,attend:$('rsvpAttend').value,
        guests:$('rsvpGuests').value,phone,msg:$('rsvpMsg').value
      })});
      const j=await r.json();
      if(!r.ok)throw new Error(j.error||'전달에 실패했어요');
      closeModal();toast('참석 여부가 전달되었습니다 🤍');
      $('rsvpForm').reset();$('rsvpGuests').value=1;
      $('rsvpAttendSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v==='yes'));
      $('rsvpAttend').value='yes';
    }catch(err){toast('⚠️ '+err.message);}
    btn.disabled=false;btn.textContent='전달하기';
  });
  if(mode==='inline'){
    /* 오시는 길 다음에 바로 보이는 형태: 모달 안의 폼을 그 자리로 옮기고, 팝업 틀은 제거 */
    $('rsvpInlineHost').appendChild($('rsvpBlock'));
    $('rsvpInlineSec').style.display='block';
    modal.remove();
  }else if(mode==='popup'){
    if(!sessionStorage.getItem('rsvpShown')){
      setTimeout(()=>{openModal();sessionStorage.setItem('rsvpShown','1');},1200);
    }
  }
})();

/* 게스트 스냅 */
(function(){
  /* 예전 데이터는 snapOn 값을, 새 데이터는 스위치 상태를 봐요 */
  if(D.secOn&&D.secOn.snap!==undefined){ if(!D.secOn.snap)return; }
  else if(!D.snapOn)return;
  const openDate=D.snapOpenDate;
  const todayKST=new Date(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date())+'T00:00:00+09:00');
  const isOpen=!openDate || new Date(openDate+'T00:00:00+09:00')<=todayKST;
  $('snapSec').style.display='block';
  if(D.snapTitle)$('snapTitleEl').textContent=D.snapTitle;
  $('snapDescEl').textContent=D.snapDesc||'예식이 진행되는 동안 자유롭게 찍어주신 사진을 올려주세요. 저희 부부에게 소중한 선물이 됩니다.';
  const btn=$('snapBtn'),file=$('snapFile'),prog=$('snapProgress');
  if(!isOpen){
    btn.disabled=true;
    btn.textContent=`${openDate}부터 업로드할 수 있어요`;
    return;
  }
  // 업로드 전 사진을 화면에서 보기 좋은 크기(최대 2000px)로 줄이고 화질을 살짝 압축해요.
  // 서버가 한 번에 받을 수 있는 용량이 4MB로 정해져 있어서, 최근 고화소 스마트폰 사진은
  // 원본 그대로 보내면 종종 4MB를 넘어 업로드가 실패하기 때문이에요.
  function resizeImage(fileObj){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      const fr=new FileReader();
      fr.onload=()=>{img.onload=()=>{
        const MAX=2000;
        let {width:w,height:h}=img;
        if(w>MAX||h>MAX){
          if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}
        }
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.85));
      };img.onerror=reject;img.src=fr.result;};
      fr.onerror=reject;
      fr.readAsDataURL(fileObj);
    });
  }
  btn.addEventListener('click',()=>file.click());
  file.addEventListener('change',async e=>{
    const files=[...e.target.files];file.value='';
    if(!files.length)return;
    if(!SLUG){toast('미리보기에서는 업로드할 수 없어요');return;}
    btn.disabled=true;
    let ok=0;
    for(let i=0;i<files.length;i++){
      prog.textContent=`업로드 중 ${i+1} / ${files.length}`;
      try{
        const dataUrl=await resizeImage(files[i]);
        const r=await fetch('/api/snap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:SLUG,dataUrl,name:files[i].name})});
        const j=await r.json();
        if(!r.ok)throw new Error(j.error||'업로드 실패');
        ok++;
      }catch(err){toast('⚠️ '+files[i].name+': '+err.message);}
    }
    prog.textContent=ok?`${ok}장 업로드 완료 🤍 감사합니다`:'업로드에 실패했어요';
    btn.disabled=false;
  });
})();

/* 푸터 */
$('footMsg').textContent=D.footMsg||`저희 두 사람의 새로운 시작을\n함께해 주셔서 감사합니다.`;
$('yr').textContent=`${N1} ♥ ${N2} · ${y}`;
function copyText(t,okMsg){
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast(okMsg)).catch(()=>fallbackCopy(t,okMsg));}
  else fallbackCopy(t,okMsg);
}
function fallbackCopy(t,okMsg){
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast(okMsg);}catch(e){toast('복사에 실패했어요');}
  document.body.removeChild(ta);
}
$('copyLink').addEventListener('click',()=>copyText(location.href,'청첩장 링크가 복사되었습니다 💌'));
